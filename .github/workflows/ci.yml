name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela execucoes antigas do mesmo branch: nao adianta esperar CI de commit superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: formato, lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # "ci" e nao "install": instala exatamente o que esta no package-lock.json.
      - run: npm ci

      - name: Formatacao
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build
