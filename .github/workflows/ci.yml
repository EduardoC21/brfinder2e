name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch: não adianta esperar CI de commit superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # "ci" e não "install": instala exatamente o que está no package-lock.json.
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
