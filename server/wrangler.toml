# A central de traduções (Etapa 54). Ver server/README.md para o passo a passo.
name = "brfinder2e-central"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# A limpeza diária (Etapa 56): candidata sem voto há 90 dias, e não a única, some.
